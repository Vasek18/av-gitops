name: Platform Helm Charts

on:
  pull_request:
    paths:
      - "platform/**"
      - "scripts/validate-platform-charts.sh"
      - ".github/workflows/platform-lint.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "scripts/validate-platform-charts.sh"
      - ".github/workflows/platform-lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: platform-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install yq
        run: |
          curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Validate every platform Application renders
        run: ./scripts/validate-platform-charts.sh
