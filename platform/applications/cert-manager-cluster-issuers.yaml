apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-cluster-issuers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vasek18/av-gitops.git
    targetRevision: main
    path: platform/cert-manager/cluster-issuers
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
